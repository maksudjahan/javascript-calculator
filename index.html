<!DOCTYPE html>
<html>

<head>
    <title>JavaScript Calculator</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .calculator {
            width: 350px;
            margin: 80px auto;
            padding: 25px;
            background-color: #1e1e1e;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin-bottom: 25px;
        }

        input {
            width: 85%;
            box-sizing: border-box;
            background-color: #2b2b2b;
            color: white;
            border: 1px solid #555;
            padding: 12px;
            margin: 6px;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background-color: #333;
            color: white;
            border: 1px solid #666;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #555;
        }

        #result {
            font-size: 25px;
            font-weight: bold;
            min-height: 30px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="calculator">
        <h1>JavaScript Calculator</h1>
        <input type="number" id="num1" placeholder="First Number">
        <input type="number" id="num2" placeholder="Second Number">
        <div>
            <button onclick="addNumbers()">Add</button>
            <button onclick="subttractNumber()">Subtract</button>
        </div>
        <div>
            <button onclick="multiplyNumber()">Multiply</button>
            <button onclick="divideNumber()">Divide</button>
        </div>
        <button onclick="clearCalculator()">Clear</button>
        <p id="result"></p>
    </div>
    <script>
        function addNumbers() {
            let {num1, num2} = getNumbers();
            if (isNaN(num1) || isNaN(num2)) {
                document.getElementById("result").textContent = "Please enter both numbers";
                return;
            }
            let result = num1 + num2;
            document.getElementById("result").textContent = result;
        }
        function subtractNumber() {
            let {num1, num2} = getNumbers();
            if (isNaN(num1) || isNaN(num2)) {
                document.getElementById("result").textContent = "Please enter both numbers";
                return;
            }
            let result = num1 - num2;
            document.getElementById("result").textContent = result;
        }
        function multiplyNumber() {
            let {num1, num2} = getNumbers();
            if (isNaN(num1) || isNaN(num2)) {
                document.getElementById("result").textContent = "Please enter both numbers";
                return;
            }
            let result = num1 * num2;
            document.getElementById("result").textContent = result;
        }
        function divideNumber() {
            let {num1, num2} = getNumbers();
            if (isNaN(num1) || isNaN(num2)) {
                document.getElementById("result").textContent = "Please enter both numbers";
                return;
            }
            if (num2 == 0) {
                document.getElementById("result").textContent = "Can not divide by zero";
                return;
            }
            let result = num1 / num2;
            document.getElementById("result").textContent = result.toFixed(2);
        }
        function clearCalculator() {
            document.getElementById("num1").value = "";
            document.getElementById("num2").value = "";
            document.getElementById("result").textContent = "";
        }
        function getNumbers() {
            let num1 = parseFloat(document.getElementById("num1").value);
            let num2 = parseFloat(document.getElementById("num2").value);
            return {num1, num2};
        }
        document.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                addNumbers();
            }
        })
    </script>
</body>

</html>
